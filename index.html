<head>

    <style>
        /* 1. 跳過主內容連結 */
        .skip-link {
            position: absolute; top: -100px; left: 0; background: #000; color: #fff;
            padding: 10px 20px; z-index: 3000; text-decoration: none; transition: top 0.3s;
        }
        .skip-link:focus { top: 0; }

        .accesskey-marker { text-decoration: none; color: inherit; font-size: 0.875rem; margin-right: 5px; }
        .visually-hidden-text {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
        }
		
		.navbar .accesskey-marker { color: #ffffff !important; }

        body { padding-top: 56px; line-height: 1.6; background-color: #f8f9fa; }

        /* Banner 樣式 */
        .hero-banner {
            background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)), url('images/banner-bg.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            min-height: 400px; display: flex; align-items: flex-end;
        }
        .hero-banner .container {
            background-image: url('images/school-title.png');
            background-size: min(100%, 600px) auto; background-position: left bottom 50px; 
            background-repeat: no-repeat; min-height: 250px; width: 100%;
        }

        /* 輪播區塊樣式 */
        .carousel-container { margin-top: 10px; margin-bottom: 30px;}
        .carousel-item img { width: 100%; height: auto; display: block; border-radius: 4px; }
        
        .carousel-controls-extra { position: absolute; bottom: 20px; right: 20px; z-index: 15; }
        .btn-pause {
            background: rgba(0,0,0,0.7); color: white; border: 2px solid #fff;
            padding: 8px 16px; border-radius: 4px; font-weight: bold;
        }

        /* 內容區塊樣式 */
        .content-section { 
            padding: 50px 0; background-color: #ffffff; border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        /* 焦點強化：符合 AA 級可視化焦點要求 */
        a:focus, button:focus, .btn:focus, [tabindex="0"]:focus {
            outline: 3px solid #ffbf47 !important; outline-offset: 2px; box-shadow: none !important;
        }

        footer { background-color: #212529; color: white; }
        .footer-link { color: #adb5bd; text-decoration: none; }
        .footer-link:hover, .footer-link:focus { color: #fff; text-decoration: underline; }
        .footer-policy-list { list-style: none; padding: 0; margin: 0; }
        .footer-policy-list li { display: inline-block; }
        .footer-policy-list li:not(:last-child)::after { content: "|"; color: #495057; margin: 0 10px; }
    </style>
</head>

						<li class="nav-item">

    <div class="container-fluid carousel-container col-md-8">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchAndInitCarousel() {
            try {
                const response = await fetch('carouselData.json');
                if (!response.ok) throw new Error('無法讀取 JSON 檔案');
                
                const carouselData = await response.json();
                const indicatorsContainer = document.getElementById('carousel-indicators-container');
                const innerContainer = document.getElementById('carousel-inner-container');

                let indicatorsHtml = '';
                let innerHtml = '';

                carouselData.forEach((item, index) => {
                    const activeClass = index === 0 ? 'active' : '';
                    const ariaCurrent = index === 0 ? 'aria-current="true"' : '';

                    indicatorsHtml += `
                        <button type="button" data-bs-target="#main-carousel" 
                            data-bs-slide-to="${index}" class="${activeClass}" 
                            ${ariaCurrent} aria-label="第 ${index + 1} 張投影片：${item.alt}"></button>`;

                    innerHtml += `
                        <div class="carousel-item ${activeClass}" 
                             role="group" 
                             aria-roledescription="slide" 
                             aria-label="第 ${index + 1} 張，共 ${carouselData.length} 張：${item.alt}">
                            <img src="${item.src}" alt="${item.alt}" class="d-block w-100">
                        </div>`;
                });

                indicatorsContainer.innerHTML = indicatorsHtml;
                innerContainer.innerHTML = innerHtml;

                startCarouselLogic();

            } catch (error) {
                console.error('載入失敗:', error);
                document.getElementById('carousel-inner-container').innerHTML = 
                    '<p class="p-4 text-danger">無法載入輪播內容，請檢查資料來源。</p>';
            }
        }

        function startCarouselLogic() {
            const carouselElement = document.querySelector('#main-carousel');
            const pauseBtn = document.querySelector('#carouselPauseBtn');
            
            const carousel = new bootstrap.Carousel(carouselElement, {
                interval: 5000,
                pause: 'hover',
                keyboard: true
            });

            let isPaused = false;

            // 鍵盤切換時自動切換至 aria-live="polite" 以便報讀
            carouselElement.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    carouselElement.setAttribute('aria-live', 'polite');
                }
            });

            pauseBtn.addEventListener('click', function() {
                if (!isPaused) {
                    carousel.pause();
                    carouselElement.setAttribute('aria-live', 'polite'); // 停止時允許報讀新內容
                    pauseBtn.innerText = '開始輪播';
                    pauseBtn.setAttribute('aria-label', '開始輪播動畫');
                    isPaused = true;
                } else {
                    carousel.cycle();
                    carouselElement.setAttribute('aria-live', 'off'); // 播放時不干擾
                    pauseBtn.innerText = '暫停輪播';
                    pauseBtn.setAttribute('aria-label', '停止輪播動畫');
                    isPaused = false;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', fetchAndInitCarousel);
    </script>
</body>
</html>
