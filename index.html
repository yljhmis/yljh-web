<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北市育林國中</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 1. 跳過主內容連結 (Skip Link) */
        .skip-link {
            position: absolute;
            top: -100px;
            left: 0;
            background: #000;
            color: #fff;
            padding: 10px 20px;
            z-index: 3000;
            text-decoration: none;
            transition: top 0.3s;
        }
        .skip-link:focus {
            top: 0;
        }

        /* 2. 視覺輔助標記 (:::) */
        .accesskey-marker {
            text-decoration: none;
            color: inherit;
            font-size: 0.875rem;
            margin-right: 5px;
        }
        .accesskey-marker:focus {
            outline: 2px solid #ffbf47;
        }

        body {
            padding-top: 56px; /* 避開固定導覽列 */
            line-height: 1.6;
        }

        /* 3. 多層 Banner 處理 */
        .hero-banner {
            /* 底層：全寬背景圖 banner-bg.png */
            background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)), url('images/banner-bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 400px;
            display: flex;
            align-items: flex-end; /* 讓容器對齊到底部 */
        }

        .hero-banner .container {
            /* 上層：標題圖 school-title.png */
            background-image: url('images/school-title.png');
            background-size: min(100%, 600px) auto;
            
            /* 修改重點：靠左，並從底部向上偏移 50px */
            background-position: left bottom 50px; 
            
            background-repeat: no-repeat;
            
            /* 調整容器高度以確保有足夠空間顯示偏移後的圖片 */
            min-height: 250px; 
            width: 100%;
        }

        /* 4. 強化焦點狀態 (Keyboard Focus) */
        a:focus, button:focus, .btn:focus {
            outline: 3px solid #ffbf47 !important;
            outline-offset: 2px;
            box-shadow: none !important;
        }

        .content-section {
            padding: 60px 0;
        }

        /* 頁尾連結樣式 */
        .footer-link {
            color: #adb5bd;
            text-decoration: none;
        }
        .footer-link:hover, .footer-link:focus {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">跳過主導覽直接進入主要內容</a>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow" aria-label="主選單">
            <div class="container">
                <a href="#accesskey-u" id="accesskey-u" class="accesskey-marker" title="上方導覽連結區" accesskey="U">:::</a>
                <a class="navbar-brand" href="/" title="回到新北市育林國中首頁">新北市育林國中</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                        aria-controls="navbarNav" aria-expanded="false" aria-label="切換導覽選單">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" href="#" aria-current="page">首頁</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">學校介紹</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">處室資訊</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">聯絡我們</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <section class="hero-banner" role="region" aria-label="歡迎區塊">
        <div class="container">
            </div>
    </section>

    <main id="main-content" class="container content-section" tabindex="-1">
        <a href="#accesskey-c" id="accesskey-c" class="accesskey-marker" title="中央內容區" accesskey="C">:::</a>
        
        <div class="row">
            <div class="col-md-8">
                <h2 class="border-bottom pb-2">最新消息</h2>
                <p><code>school-title.png</code> 現在距離 Banner 底部有 50px 的間距，維持左側對齊。</p>
                <div style="height: 300px; background-color: #f8f9fa; border: 1px dashed #dee2e6;" class="d-flex align-items-center justify-content-center">
                    主要內容展示區
                </div>
            </div>
            <div class="col-md-4">
                <h2 class="border-bottom pb-2">快速連結</h2>
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action">校園行事曆</a>
                    <a href="#" class="list-group-item list-group-item-action">教育局通報</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white pt-5 pb-3">
        <div class="container text-center">
            <p>&copy; 2025 新北市育林國中 版權所有</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
